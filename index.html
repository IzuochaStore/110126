<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Puedo ser tu novio?</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}

body{
    width:100vw;
    height:100vh;
    background:linear-gradient(#9bdcff,#eaf6ff);
    overflow:hidden;
}

/* PREGUNTA */
#question, #freeText{
    position:fixed;
    top:12%;
    width:100%;
    text-align:center;
    font-size:2rem;
    color:#c9184a;
}
#freeText{display:none;font-size:1.5rem}

/* BOTONES */
#buttons{
    position:fixed;
    top:30%;
    width:100%;
    height:150px;
}
button{
    position:absolute;
    padding:14px 30px;
    border:none;
    border-radius:30px;
    font-size:1.2rem;
}
#yes{
    background:#ff4d6d;
    color:white;
    left:50%;
    transform:translateX(-50%);
}
#no{
    background:#adb5bd;
    color:white;
    left:50%;
    top:70px;
    transform:translateX(-50%);
}

/* CONFETI */
.confetti{
    position:fixed;
    top:-20px;
    font-size:22px;
    animation:fall linear forwards;
}
@keyframes fall{
    to{transform:translateY(110vh) rotate(360deg);opacity:0}
}

/* CORTINA */
#curtain{
    position:fixed;
    inset:0;
    background:#fff0f3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3rem;
    z-index:10;
    transform:translateY(-100%);
    transition:1s;
}

/* TIERRA */
#ground{
    position:fixed;
    bottom:0;
    width:100%;
    height:110px;
    z-index:5;
}
#soil{
    height:60px;
    background:#8d5524;
    border-top:6px solid #2d6a4f;
}

/* SEMILLA */
#sprout{
    position:fixed;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    font-size:2rem;
    display:none;
    z-index:4;
    animation:drop 2.5s forwards;
}
@keyframes drop{
    to{top:calc(100vh - 100px)}
}

/* RAMO */
#bouquet{
    position:fixed;
    bottom:60px;
    left:20px;
    display:none;
    z-index:6;
    animation:wind 3s ease-in-out infinite;
}
@keyframes wind{
    0%,100%{transform:rotate(0deg)}
    50%{transform:rotate(2deg)}
}

/* CONTADOR */
#counter{
    position:fixed;
    bottom:90px;
    left:160px;
    font-size:1rem;
    color:#1b4332;
    display:none;
}
</style>
</head>

<body>

<div id="question">¿Puedo ser tu novio?</div>
<div id="freeText">💬 Texto libre aquí</div>

<div id="buttons">
    <button id="yes">Sí ✨</button>
    <button id="no">No 😅</button>
</div>

<div id="curtain">💗❤️💘🤍</div>

<div id="sprout">🌱</div>

<div id="bouquet">
    <div style="text-align:center;font-size:1.6rem;line-height:1.3">
        🌷🌹<br>
        🌹🌷🌹🌷<br>
        🌷🌹🌷🌹🌷🌹<br>
        🎀
    </div>
</div>

<div id="counter">
    <div id="time">Llevamos 0 segundos de novios 🎉🎉🎉❤️❤️❤️❤️❤️🥳🥳🥳</div>
</div>

<div id="ground"><div id="soil"></div></div>

<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const buttons=document.getElementById("buttons");
const question=document.getElementById("question");
const freeText=document.getElementById("freeText");
const curtain=document.getElementById("curtain");
const sprout=document.getElementById("sprout");
const bouquet=document.getElementById("bouquet");
const counter=document.getElementById("counter");
const time=document.getElementById("time");

no.onclick=()=>{
    no.style.left=Math.random()*70+"%";
    no.style.top=Math.random()*100+"px";
};

yes.onclick=()=>{
    buttons.style.display="none";
    question.style.display="none";
    freeText.style.display="block";

    confetti();

    curtain.style.transform="translateY(0)";
    setTimeout(()=>{
        curtain.style.display="none";
        sprout.style.display="block";
    },1000);

    setTimeout(()=>{
        bouquet.style.display="block";
        counter.style.display="block";
        startCounter();
    },4500);
};

function confetti(){
    const e=["💗","❤️","💘","🤍"];
    for(let i=0;i<60;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.textContent=e[Math.floor(Math.random()*4)];
        c.style.left=Math.random()*100+"vw";
        c.style.animationDuration=(Math.random()*2+2)+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
}

function startCounter(){
    let s=0;
    setInterval(()=>{
        s++;
        time.textContent=`Llevamos ${s} segundos de novios 🎉🎉🎉❤️❤️❤️❤️❤️🥳🥳🥳`;
    },1000);
}
</script>

</body>
</html>
