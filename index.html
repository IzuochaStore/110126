<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Puedo ser tu novio?</title>

<style>
    * {
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        background: #fff5f7;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 30px;
        color: #c9184a;
    }

    #buttons {
        position: relative;
        width: 100%;
        height: 200px;
    }

    button {
        padding: 15px 30px;
        font-size: 1.2rem;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        position: absolute;
        transition: 0.3s;
    }

    #yes {
        background: #ff4d6d;
        color: white;
        left: 50%;
        transform: translateX(-50%);
    }

    #no {
        background: #adb5bd;
        color: white;
    }

    /* Confeti */
    .confetti {
        position: fixed;
        top: -10px;
        font-size: 20px;
        animation: fall linear forwards;
        pointer-events: none;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }

    /* Cortina */
    #curtain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff0f3;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        z-index: 10;
        transform: translateY(-100%);
        transition: 1s;
    }

    #heart-center {
        display: none;
        font-size: 5rem;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }

    #love-text {
        display: none;
        font-size: 1.5rem;
        margin-top: 10px;
        color: #c9184a;
    }

    /* Tierra */
    #ground {
        position: fixed;
        bottom: 0;
        width: 100%;
        height: 120px;
    }

    #soil {
        height: 60px;
        background: #8d5524;
        border-top: 5px solid #2d6a4f;
    }

    /* Semilla */
    #seed {
        position: absolute;
        font-size: 1.5rem;
        top: 50%;
        display: none;
        animation: drop 2s forwards;
    }

    @keyframes drop {
        to {
            top: calc(100vh - 120px);
        }
    }

    /* Flores */
    #bouquet {
        position: absolute;
        bottom: 60px;
        display: none;
        font-size: 2rem;
        animation: wind 3s ease-in-out infinite;
    }

    @keyframes wind {
        0%,100% { transform: rotate(0deg); }
        50% { transform: rotate(2deg); }
    }

    /* Contador */
    #counter {
        position: absolute;
        bottom: 70px;
        left: 20px;
        display: none;
        text-align: left;
        color: #1b4332;
    }

    #counter h3 {
        margin: 0 0 5px 0;
    }

</style>
</head>

<body>

<h1>¿Puedo ser tu novio?</h1>

<div id="buttons">
    <button id="yes">Sí 💖</button>
    <button id="no">No 😅</button>
</div>

<div id="curtain">
    💗❤️💘🤍
</div>

<div id="heart-center">❤️</div>
<div id="love-text">Te amo Natali 🫶🏻❤️✨</div>

<div id="seed">🌱</div>

<div id="bouquet">
    🌷🌷🌷🌷🌹🌷🌷🌷🌷🌹
</div>

<div id="counter">
    <h3>💬 Texto libre aquí</h3>
    <p id="time">Llevamos 0 segundos siendo novios 😚❤️</p>
</div>

<div id="ground">
    <div id="soil"></div>
</div>

<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const curtain = document.getElementById("curtain");
    const heart = document.getElementById("heart-center");
    const loveText = document.getElementById("love-text");
    const seed = document.getElementById("seed");
    const bouquet = document.getElementById("bouquet");
    const counter = document.getElementById("counter");
    const timeText = document.getElementById("time");

    noBtn.style.left = "20%";
    noBtn.style.top = "60%";

    noBtn.addEventListener("click", () => {
        noBtn.style.left = Math.random() * 80 + "%";
        noBtn.style.top = Math.random() * 80 + "%";
    });

    yesBtn.addEventListener("click", () => {
        launchConfetti();
        curtain.style.transform = "translateY(0)";

        setTimeout(() => {
            curtain.style.display = "none";
            heart.style.display = "block";
            loveText.style.display = "block";
        }, 1200);

        setTimeout(() => {
            heart.style.animation = "none";
            heart.textContent = "🌰";
            seed.style.display = "block";
        }, 3000);

        setTimeout(() => {
            bouquet.style.display = "block";
        }, 5500);

        setTimeout(() => {
            bouquet.style.left = "20px";
            counter.style.display = "block";
            startCounter();
        }, 6500);
    });

    function launchConfetti() {
        const emojis = ["💗","❤️","💘","🤍"];
        for (let i = 0; i < 80; i++) {
            const conf = document.createElement("div");
            conf.className = "confetti";
            conf.textContent = emojis[Math.floor(Math.random()*emojis.length)];
            conf.style.left = Math.random() * 100 + "vw";
            conf.style.animationDuration = (Math.random() * 2 + 2) + "s";
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 4000);
        }
    }

    function startCounter() {
        let seconds = 0;
        setInterval(() => {
            seconds++;
            timeText.textContent = `Llevamos ${seconds} segundos siendo novios 😚❤️`;
        }, 1000);
    }
</script>

</body>
</html>
