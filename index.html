<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Puedo ser tu novio?</title>

<style>
*{
    box-sizing:border-box;
    font-family:system-ui,Segoe UI,sans-serif;
}

body{
    margin:0;
    height:100vh;
    background:#fff1f3;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#question{
    font-size:2rem;
    color:#c9184a;
    margin-bottom:30px;
}

#freeText{
    display:none;
    font-size:1.4rem;
    color:#c9184a;
    margin-bottom:30px;
}

#buttons{
    position:relative;
    width:100%;
    height:180px;
}

button{
    padding:15px 32px;
    font-size:1.2rem;
    border:none;
    border-radius:30px;
    cursor:pointer;
    position:absolute;
}

#yes{
    background:#ff4d6d;
    color:white;
    left:50%;
    transform:translateX(-50%);
}

#no{
    background:#adb5bd;
    color:white;
}

/* confeti */
.confetti{
    position:fixed;
    top:-10px;
    font-size:22px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* cortina */
#curtain{
    position:fixed;
    inset:0;
    background:#fff0f3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3rem;
    z-index:10;
    transform:translateY(-100%);
    transition:1s;
}

/* suelo */
#ground{
    position:fixed;
    bottom:0;
    width:100%;
    height:120px;
}

#soil{
    height:60px;
    background:#8d5524;
    border-top:6px solid #2d6a4f;
}

/* semilla */
#sprout{
    position:fixed;
    top:-40px;
    font-size:2rem;
    display:none;
    animation:drop 2.5s forwards;
}

@keyframes drop{
    to{
        top:calc(100vh - 120px);
    }
}

/* ramo */
#bouquet{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%) scaleY(0);
    transform-origin:bottom;
    display:none;
    animation:grow 2s forwards, wind 3s ease-in-out infinite;
}

@keyframes grow{
    to{
        transform:translateX(-50%) scaleY(1);
    }
}

@keyframes wind{
    0%,100%{ transform:translateX(-50%) rotate(0deg); }
    50%{ transform:translateX(-50%) rotate(2deg); }
}

/* mover a la izquierda */
.move-left{
    transition:1s;
    left:10px !important;
    transform:scale(1) !important;
}

/* contador */
#counter{
    position:fixed;
    bottom:80px;
    left:160px;
    display:none;
    text-align:left;
    color:#1b4332;
    font-size:1rem;
}
</style>
</head>

<body>

<div id="question">¿Puedo ser tu novio?</div>
<div id="freeText">💬 Texto libre aquí</div>

<div id="buttons">
    <button id="yes">Sí ✨</button>
    <button id="no">No 😅</button>
</div>

<div id="curtain">💗❤️💘🤍</div>

<div id="sprout">🌱</div>

<div id="bouquet">
    <div style="text-align:center;font-size:1.6rem;">
        🌷🌹<br>
        🌹🌷🌹🌷<br>
        🌷🌹🌷🌹🌷🌹<br>
        🎀
    </div>
</div>

<div id="counter">
    <div id="time">Llevamos 0 segundos de novios 🎉🎉🎉❤️❤️❤️❤️❤️🥳🥳🥳</div>
</div>

<div id="ground">
    <div id="soil"></div>
</div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const curtain=document.getElementById("curtain");
const question=document.getElementById("question");
const freeText=document.getElementById("freeText");
const buttons=document.getElementById("buttons");
const sprout=document.getElementById("sprout");
const bouquet=document.getElementById("bouquet");
const counter=document.getElementById("counter");
const timeText=document.getElementById("time");

noBtn.style.left="20%";
noBtn.style.top="60%";

noBtn.onclick=()=>{
    noBtn.style.left=Math.random()*80+"%";
    noBtn.style.top=Math.random()*70+"%";
};

yesBtn.onclick=()=>{
    buttons.style.display="none";
    question.style.display="none";
    freeText.style.display="block";

    launchConfetti();

    curtain.style.transform="translateY(0)";
    setTimeout(()=>{
        curtain.style.display="none";
        sprout.style.display="block";
    },1000);

    setTimeout(()=>{
        bouquet.style.display="block";
    },3500);

    setTimeout(()=>{
        bouquet.classList.add("move-left");
        counter.style.display="block";
        startCounter();
    },5500);
};

function launchConfetti(){
    const e=["💗","❤️","💘","🤍"];
    for(let i=0;i<70;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.textContent=e[Math.floor(Math.random()*e.length)];
        c.style.left=Math.random()*100+"vw";
        c.style.animationDuration=(Math.random()*2+2)+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
}

function startCounter(){
    let s=0;
    setInterval(()=>{
        s++;
        timeText.textContent=`Llevamos ${s} segundos de novios 🎉🎉🎉❤️❤️❤️❤️❤️🥳🥳🥳`;
    },1000);
}
</script>

</body>
</html>
